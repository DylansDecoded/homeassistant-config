- id: downstairs_lights_morning_schedule
  alias: Downstairs Lights - Morning Schedule
  description: Turn downstairs lights on daily at 5:00 AM and off daily at 6:30 AM.
  triggers:
    - trigger: time
      at: "05:00:00"
      id: turn_on
    - trigger: time
      at: "06:30:00"
      id: turn_off
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: turn_on
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.breakfast_nook_lights
                  - light.butlers_pantry_light
                  - light.coffee_bar_lamp
                  - light.dining_room_light
                  - light.entryway_dimmer
                  - light.garage_entrance_dimmer
                  - light.kitchen_island_lights
                  - light.kitchen_recessed_lighting
                  - light.living_room
                  - light.living_room_ceiling_light
                  - light.stairs_lighting
        - conditions:
            - condition: trigger
              id: turn_off
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.breakfast_nook_lights
                  - light.butlers_pantry_light
                  - light.coffee_bar_lamp
                  - light.dining_room_light
                  - light.entryway_dimmer
                  - light.garage_entrance_dimmer
                  - light.kitchen_island_lights
                  - light.kitchen_recessed_lighting
                  - light.living_room
                  - light.living_room_ceiling_light
                  - light.stairs_lighting
  mode: single
