- id: upstairs_thermostat_night_day_setpoint
  alias: Upstairs Thermostat • Night/Day Setpoint
  description: From 12:00 AM–5:59 AM set to 68°F; from 6:00 AM–11:59 PM set to 70°F.
    If outside temp < 55°F, set to Auto mode with heat=66°F, cool=68°F. Re-applies
    on boundaries, every 10 minutes, and after HA restarts.
  mode: single
  trigger:
  - platform: time
    at: 00:00:00
  - platform: time
    at: 06:00:00
  - platform: time_pattern
    minutes: /10
  - platform: homeassistant
    event: start
  variables:
    target_entity: climate.upstairs_thermostat
    outdoor_sensor: sensor.outdoor_temperature
    outside_temp: '{{ states(outdoor_sensor) | float(100) }}'
    desired_temp: '{% set h = now().hour %} {{ 68 if h < 6 else 70 }}'
    current_temp: '{{ state_attr(target_entity, ''temperature'') }}'
    is_available: '{{ states(target_entity) not in [''unavailable'', ''unknown'']
      }}'
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ outside_temp < 55 }}'
      - condition: template
        value_template: '{{ is_available }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: '{{ target_entity }}'
        data:
          hvac_mode: auto
      - service: climate.set_temperature
        target:
          entity_id: '{{ target_entity }}'
        data:
          target_temp_low: 66
          target_temp_high: 68
    - conditions:
      - condition: template
        value_template: '{{ is_available }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: '{{ target_entity }}'
        data:
          hvac_mode: cool
      - condition: template
        value_template: "{{ current_temp is not number or\n   (current_temp | float)
          != (desired_temp | float) }}"
      - service: climate.set_temperature
        target:
          entity_id: '{{ target_entity }}'
        data:
          temperature: '{{ desired_temp }}'
- id: christmas_tree_schedule
  description: 'ON at sunset until midnight, then ON again 5:30 AM–9:00 AM (weekdays
    only).

    '
  triggers:
  - event: sunset
    offset: 00:00:00
    id: turn_on
    trigger: sun
  - at: 00:00:00
    id: turn_off
    trigger: time
  - at: 05:30:00
    id: turn_on
    trigger: time
  - at: 09:00:00
    id: turn_off
    trigger: time
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: turn_on
      sequence:
      - target:
          entity_id: switch.living_room_outlet_01
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: turn_off
      - condition: template
        value_template: "{% if trigger.now.strftime('%H:%M') == '09:00' %}\n  {{ now().isoweekday()
          not in [6, 7] }}\n{% else %}\n  true\n{% endif %}\n"
      sequence:
      - target:
          entity_id: switch.living_room_outlet_01
        action: switch.turn_off
  mode: single
- id: '1762867886031'
