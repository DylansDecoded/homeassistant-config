title: Security
path: security
icon: mdi:shield-home-outline
type: sections
max_columns: 3
theme: Robson Manor
sections:
- type: grid
  cards:
  - type: heading
    heading: Alarm & garage
    heading_style: title
    icon: mdi:shield-check-outline
  - type: alarm-panel
    entity: alarm_control_panel.robson_manor_alarm
    name: Robson Manor
    states:
    - arm_home
    - arm_away
    grid_options:
      columns: full
      rows: auto
  - type: tile
    entity: cover.garage_door_opener
    name: Garage door
    tap_action:
      action: more-info
    grid_options:
      columns: 12
      rows: auto
    features:
    - type: cover-open-close
    icon_tap_action:
      action: more-info
  - type: entity-filter
    entities:
    - entity: binary_sensor.front_door_sensor
      name: Front door
    - entity: binary_sensor.sliding_door_sensor
      name: Sliding door
    - entity: binary_sensor.garage_door_sensor
      name: Garage entry
    - entity: binary_sensor.left_gate_sensor
      name: Left gate
    - entity: binary_sensor.breakfast_nook_window_sensor_01
      name: Breakfast nook 1
    - entity: binary_sensor.breakfast_nook_window_sensor_02
      name: Breakfast nook 2
    - entity: binary_sensor.dining_room_window_sensor_01
      name: Dining room 1
    - entity: binary_sensor.dining_room_window_sensor_02
      name: Dining room 2
    - entity: binary_sensor.living_room_window_sensor_01
      name: Living room 1
    - entity: binary_sensor.living_room_window_sensor_02
      name: Living room 2
    state_filter:
    - 'on'
    show_empty: false
    card:
      type: entities
      title: Open doors & windows
      show_header_toggle: false
    grid_options:
      columns: full
      rows: auto
- type: grid
  cards:
  - type: heading
    heading: Doors & gate
    heading_style: title
    icon: mdi:door-closed
