title: Media
path: media
icon: mdi:speaker
type: sections
max_columns: 3
theme: Robson Manor
sections:
- type: grid
  cards:
  - type: heading
    heading: Family room
    heading_style: title
    icon: mdi:television-speaker
  - type: media-control
    entity: media_player.family_room
    grid_options:
      columns: full
      rows: auto
  - type: tile
    entity: switch.family_room_night_sound
    name: Night sound
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: auto
    color: amber
  - type: tile
    entity: switch.family_room_speech_enhancement
    name: Speech enhancement
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: auto
    color: amber
- type: grid
  cards:
  - type: heading
    heading: Portable speaker
    heading_style: title
    icon: mdi:speaker-wireless
  - type: media-control
    entity: media_player.portable
    grid_options:
      columns: full
      rows: auto
  - type: tile
    entity: sensor.portable_battery
    name: Battery
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: auto
  - type: tile
    entity: binary_sensor.portable_charging
    name: Charging
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: auto
    icon_tap_action:
      action: more-info
- type: grid
  cards:
  - type: heading
    heading: Bengals game day
    heading_style: title
    icon: mdi:football
  - type: markdown
    text_only: true
    content: '{% set team = state_attr(''sensor.cincinnati_bengals'', ''team_abbr'') %}

      {% set opponent = state_attr(''sensor.cincinnati_bengals'', ''opponent_abbr'') %}

      ## {{ team or ''CIN'' }} vs {{ opponent or ''TBD'' }}

      {% if is_state(''sensor.cincinnati_bengals'', ''IN'') or is_state(''sensor.cincinnati_bengals'',
      ''POST'') %}

      **{{ state_attr(''sensor.cincinnati_bengals'', ''team_score'') }} - {{ state_attr(''sensor.cincinnati_bengals'',
      ''opponent_score'') }}**

      {% elif is_state(''sensor.cincinnati_bengals'', ''PRE'') %}

      {% set kickoff = as_timestamp(state_attr(''sensor.cincinnati_bengals'', ''date''), none) %}

      {{ kickoff | timestamp_custom(''%a, %b %-d at %-I:%M %p'', true) if kickoff is not none else ''Kickoff
      pending'' }}

      {% else %}

      Game information is currently unavailable.

      {% endif %}'
    grid_options:
      columns: full
      rows: auto
  - type: tile
    entity: sensor.bengals_pregame_start
    name: Pregame starts
    tap_action:
      action: more-info
    grid_options:
      columns: 12
      rows: auto
  - type: shortcut
    label: Game lighting
    icon: mdi:football
    tap_action:
      action: perform-action
      perform_action: scene.turn_on
      target:
        entity_id: scene.living_room_bengals_game
    grid_options:
      columns: 6
      rows: 1
  - type: shortcut
    label: Read lighting
    icon: mdi:book-open-page-variant-outline
    tap_action:
      action: perform-action
      perform_action: scene.turn_on
      target:
        entity_id: scene.living_room_read
    grid_options:
      columns: 6
      rows: 1
  - type: shortcut
    label: Touchdown celebration
    icon: mdi:party-popper
    tap_action:
      action: perform-action
      perform_action: script.turn_on
      target:
        entity_id: script.bengals_touchdown_celebration
      confirmation:
        text: Run the touchdown light and sound celebration?
    grid_options:
      columns: 12
      rows: 1
  - type: shortcut
    label: Win celebration
    icon: mdi:party-popper
    tap_action:
      action: perform-action
      perform_action: script.turn_on
      target:
        entity_id: script.bengals_win_celebration
      confirmation:
        text: Run the win light and sound celebration?
    grid_options:
      columns: 12
      rows: 1
