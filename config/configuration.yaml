
# Loads default set of integrations. Do not remove.
default_config:

config:

# Reverse Proxy settings
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.1.20.92     # Your Traefik/ingress server IP
    - 10.1.0.0/16 # Your local network range
  # Add the domain that requests will come from
  cors_allowed_origins:
    - https://hass.robsonhome.cloud
    - http://hass.internal



script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include sensors.yaml
binary_sensor: !include binary_sensors.yaml

homekit: !include homekit.yaml
group: !include_dir_merge_named groups
# device_tracker: !include_dir_merge_list device_tracker - All trackers have been moved to the UI.
automation: !include_dir_merge_list automations
# scene: !include_dir_merge_list scenes
# script: !include_dir_merge_named script
