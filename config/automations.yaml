- id: bengals_touchdown_trigger
  alias: Bengals Touchdown Trigger
  description: Bengals score auto celebrate
  triggers:
  - entity_id:
    - sensor.cincinnati_bengals
    trigger: state
    attribute: team_score
  conditions:
  - condition: template
    value_template: '{{ (trigger.to_state.attributes.team_score | int) >  (trigger.from_state.attributes.team_score
      | int) }}

      '
  actions:
  - action: script.bengals_touchdown_celebration
  mode: single
