  - type: shortcut
    label: Read
    icon: mdi:palette-outline
    tap_action:
      action: perform-action
      perform_action: scene.turn_on
      target:
        entity_id: scene.living_room_read
    grid_options:
      columns: 6
      rows: 1
  - type: shortcut
    label: Relax
    icon: mdi:palette-outline
    tap_action:
      action: perform-action
      perform_action: scene.turn_on
      target:
        entity_id: scene.living_room_relax
    grid_options:
      columns: 6
      rows: 1
  - type: shortcut
    label: Bengals
    icon: mdi:football
    tap_action:
      action: perform-action
      perform_action: scene.turn_on
      target:
        entity_id: scene.living_room_bengals_game
    grid_options:
      columns: 6
      rows: 1
  - type: shortcut
    label: All scenes
    icon: mdi:palette-outline
    tap_action:
      action: navigate
      navigation_path: /lovelace/scenes
    grid_options:
      columns: 6
      rows: 1
